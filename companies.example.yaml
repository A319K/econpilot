# Example seed list for scripts/seed_companies.py.
# Every board id below was verified live against its real API on 2026-07-02.
#
# How to find a company's ATS board id:
#   Greenhouse: visit the company's careers page; if it redirects to
#     boards.greenhouse.io/<board_id> or job-boards.greenhouse.io/<board_id>,
#     that slug is the board id.
#   Lever: careers pages on Lever redirect to jobs.lever.co/<board_id>.
#   Ashby: careers pages on Ashby redirect to jobs.ashbyhq.com/<board_id>.
# Board ids occasionally change if a company migrates ATS providers --
# verify against the live careers page before relying on this file.

companies:
  - name: Stripe
    ats_type: greenhouse
    ats_board_id: stripe
    careers_url: https://stripe.com/jobs
    is_target: true

  - name: Airbnb
    ats_type: greenhouse
    ats_board_id: airbnb
    careers_url: https://careers.airbnb.com
    is_target: true

  - name: Robinhood
    ats_type: greenhouse
    ats_board_id: robinhood
    careers_url: https://careers.robinhood.com
    is_target: false

  - name: Coinbase
    ats_type: greenhouse
    ats_board_id: coinbase
    careers_url: https://www.coinbase.com/careers
    is_target: false

