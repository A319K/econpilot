[project]
name = "econpilot-backend"
version = "0.1.0"
description = "EconPilot — local-first job discovery, LLM materials pipeline, application tracking, and a human-supervised form-filling agent."
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.3",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.2",
    "email-validator>=2.2.0",
    "python-dotenv>=1.0.1",
    "apscheduler>=3.10.4",
]

[project.urls]
Homepage = "https://github.com/A319K/job-pilot"
Repository = "https://github.com/A319K/job-pilot"
Issues = "https://github.com/A319K/job-pilot/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]
# Phase 5 application agent. Kept optional so the base install and the bulk of
# the test suite stay browser-free; install with `uv pip install -e '.[agent]'`
# then `playwright install chromium`.
agent = [
    "playwright>=1.48",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "latex: requires a real LaTeX compiler (e.g. tectonic) on PATH",
    "agent: requires Playwright + a real Chromium (install the 'agent' extra)",
]
